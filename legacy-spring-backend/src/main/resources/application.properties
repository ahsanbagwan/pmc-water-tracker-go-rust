spring.application.name=pmc-water-tracker
server.port=8080

# Default profile if none is set (local dev): H2 in-memory, zero setup.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Initial admin account -------------------------------------------------
# Created automatically on first startup (only if no users exist yet).
# This default is ONLY for local dev -- on Render (or anywhere public), set
# ADMIN_USERNAME and ADMIN_PASSWORD env vars to real values. Don't deploy
# with these defaults in place; they're sitting here in plain text in a
# public repo.
app.admin-username=${ADMIN_USERNAME:admin}
app.admin-password=${ADMIN_PASSWORD:change-me-now}

# --- JWT signing secret ----------------------------------------------------
# Used to sign/verify login tokens. This default is ONLY for local dev -- on
# Render (or anywhere public), set a real random JWT_SECRET (32+ chars, e.g.
# `openssl rand -base64 48`). The app refuses to start under the prod profile
# if this default is still in place.
# RS256: private key signs, public key verifies -- see JwtService's class comment for how to
# generate these via openssl. Left unset in dev, JwtService auto-generates a throwaway
# in-memory keypair (won't survive a restart -- fine for local iteration, never for prod).
app.jwt-private-key-b64=${JWT_PRIVATE_KEY_B64:}
app.jwt-public-key-b64=${JWT_PUBLIC_KEY_B64:}
# Token lifetime in ms -- defaults to 12 hours. After this, users need to log in again.
app.jwt-expiration-ms=${JWT_EXPIRATION_MS:43200000}

# --- Ollama-powered report analysis (urgency + duplicate judgment) --------
# $0 cost -- but needs Ollama actually running (locally: `ollama serve`, after
# `ollama pull llama3.2`). Disabled by default.
app.ollama-enabled=${OLLAMA_ENABLED:false}
app.ollama-host=${OLLAMA_HOST:http://localhost:11434}
app.ollama-model=${OLLAMA_MODEL:llama3.2}

# --- Which incoming HTTP headers become structured log fields (via MDC) ------
# Comma-separated allowlist, e.g. "X-Tenant-Id,User-Agent". Empty by default -- deliberately
# opt-in, since headers can carry sensitive data that shouldn't land in log storage unreviewed.
app.mdc-headers=${MDC_HEADERS:}

# --- Redis: shared state across pods (rate limiting, feature toggle) -------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# --- RabbitMQ (optional) ----------------------------------------------------
# Disabled by default -- the app runs fine with no broker at all until you set this up.
# Set RABBITMQ_ENABLED=true plus the connection vars below once you have a broker
# (e.g. CloudAMQP's free tier, or Aiven if they offer RabbitMQ on your plan).
app.rabbitmq.enabled=${RABBITMQ_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

# --- Email notifications ----------------------------------------------------
# Used by ReportNotificationListener to email you when a citizen submits a report.
# Only fires if RabbitMQ is also enabled above, and only sends if BREVO_API_KEY,
# MAIL_FROM_ADDRESS, and ADMIN_NOTIFICATION_EMAIL are all set -- otherwise it logs a
# warning and skips silently rather than failing report submission.
#
# Uses Brevo's HTTP API (not SMTP) -- Render's free tier blocks outbound SMTP ports
# entirely, so a normal SMTP provider (Gmail etc.) cannot work here regardless of
# credentials. Brevo's API goes over HTTPS/443 like everything else, so it isn't
# affected. Sign up free at brevo.com, verify a sender email, generate an API key
# under SMTP & API settings.
app.brevo-api-key=${BREVO_API_KEY:}
app.mail-from-address=${MAIL_FROM_ADDRESS:}
app.admin-notification-email=${ADMIN_NOTIFICATION_EMAIL:}
