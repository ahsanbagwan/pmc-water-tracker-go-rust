# Production: MySQL, e.g. Aiven's free MySQL plan. All connection details come from env
# vars -- nothing sensitive lives in this file.
#
# Required env vars: DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
#
# sslMode=REQUIRED encrypts the connection without verifying Aiven's CA certificate chain --
# simplest option for a hobby project. If you want full certificate verification instead,
# download Aiven's CA cert and switch to sslMode=VERIFY_CA with a truststore configured.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# schema.sql only auto-runs for embedded databases (H2) by default -- without this, ShedLock's
# required table would never actually get created against real MySQL, and the app would fail
# at runtime with "table 'shedlock' doesn't exist" the first time a scheduled job tries to lock.
spring.sql.init.mode=always

# Schema is created once and preserved across restarts/redeploys -- this is what makes
# locality edits and user accounts persist, unlike dev's in-memory H2.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# --- OpenTelemetry (traces + metrics via OTLP) ------------------------------
# service.name defaults to spring.application.name automatically -- no separate config needed.
# Point these at any OTLP-compatible backend (Grafana Cloud, Honeycomb, self-hosted collector).
# Grafana Cloud's OTLP gateway wants Basic auth: base64(instanceID:apiToken) as the header value.
management.otlp.tracing.endpoint=${OTLP_TRACES_ENDPOINT:}
management.otlp.tracing.headers.Authorization=${OTLP_AUTH_HEADER:}
management.tracing.sampling.probability=${OTLP_SAMPLING_PROBABILITY:1.0}

management.otlp.metrics.export.url=${OTLP_METRICS_ENDPOINT:}
management.otlp.metrics.export.headers.Authorization=${OTLP_AUTH_HEADER:}
management.otlp.metrics.export.step=15s

management.endpoints.web.exposure.include=health,info,metrics,prometheus
