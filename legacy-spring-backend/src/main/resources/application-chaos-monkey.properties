# Chaos Monkey for Spring Boot -- see https://codecentric.github.io/chaos-monkey-spring-boot/
#
# Double opt-in by design: the library itself only activates when BOTH the
# "chaos-monkey" Spring profile is active AND chaos.monkey.enabled=true are true.
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=dev,chaos-monkey
# (combine with dev or prod; dev+H2 is the sane default for actually trying this out)

chaos.monkey.enabled=true

# What kinds of Spring beans get attacked. Kept to the request-handling layers --
# leaving "component" off avoids attacking unrelated infra beans (config, filters, etc.)
chaos.monkey.watcher.controller=true
chaos.monkey.watcher.rest-controller=true
chaos.monkey.watcher.service=true
chaos.monkey.watcher.repository=true
chaos.monkey.watcher.component=false

# 1-in-N chance per watched call. Deliberately conservative -- turn this down (toward 1)
# once you're confident about what you're doing, via the actuator endpoint below rather
# than editing this file, so nothing risky is a baked-in default.
chaos.monkey.assaults.level=5

# Latency only, by default -- noticeable but not destructive. Exceptions and app-killing
# are left OFF here on purpose; turn them on live via the actuator endpoint when you
# actually want that blast radius, not as a startup default.
chaos.monkey.assaults.latency-active=true
chaos.monkey.assaults.latency-range-start=1000
chaos.monkey.assaults.latency-range-end=3000
chaos.monkey.assaults.exceptions-active=false
chaos.monkey.assaults.kill-application-active=false
chaos.monkey.assaults.memory-active=false

# Exposes /actuator/chaosmonkey/** for live control (status, enable/disable, tweak assaults).
# Restricted to ADMIN in SecurityConfig.
management.endpoint.chaosmonkey.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus,chaosmonkey
