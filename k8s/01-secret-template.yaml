# WARNING: Kubernetes Secrets are only base64-ENCODED, not encrypted, unless your specific
# cluster has encryption-at-rest explicitly configured (many don't, by default). Never commit
# this file with real values filled in -- treat it exactly like ci/credentials.yml from the
# Concourse pipeline: a local-only template, gitignored once real values are added.
#
# The genuinely correct approach, tying directly back to the Vault work already done for the
# Concourse pipeline: use the External Secrets Operator or Vault Agent Injector to pull these
# values live from Vault into the cluster, so no secret value ever sits in a YAML file (local
# or committed) at all -- same principle as ((var)) resolution in the pipeline, just for
# runtime pods instead of CI. This template is the "getting started" version, not the
# recommended production path.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: pmc-water-tracker
type: Opaque
stringData:
  DB_USERNAME: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"
  ADMIN_PASSWORD: "REPLACE_ME"
  JWT_PRIVATE_KEY_B64: "REPLACE_ME"
  JWT_PUBLIC_KEY_B64: "REPLACE_ME"
  BREVO_API_KEY: ""
  MAIL_FROM_ADDRESS: ""
  ADMIN_NOTIFICATION_EMAIL: ""
  RABBITMQ_HOST: ""
  RABBITMQ_PORT: "5671"
  RABBITMQ_USERNAME: ""
  RABBITMQ_PASSWORD: ""
  RABBITMQ_VHOST: ""
  RABBITMQ_SSL_ENABLED: "true"
