server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # try_files falls back to index.html for anything not a real file on disk -- without
    # this, refreshing the page on any path other than "/" would 404 at the nginx level
    # before React ever gets a chance to load.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
