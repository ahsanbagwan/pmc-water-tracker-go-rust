name: Go + Rust tests
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: go-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: go vet ./...
      - run: go test -race ./...           # default build: stdlib only, no network needed
      - run: go mod tidy && go build -tags prod ./cmd/api   # compiles the MySQL/bcrypt/RabbitMQ adapters
  rust:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: rust-geo } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
